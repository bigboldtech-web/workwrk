name: CI

# Quality gate: validates the Prisma schema and runs the unit suite on every PR
# and on pushes to main. Deploy (.github/workflows/deploy.yml) waits for this to
# pass before shipping.
#
# The unit suite is what makes the nav completeness test a real gate: adding a
# route under src/app/(dashboard) without a ROUTE_HUB row fails
# src/lib/nav/route-hub.test.ts, and therefore fails here.
#
# Blast radius, stated so nobody inherits it by surprise: deploy.yml keys off
# this WORKFLOW's conclusion, not off one job, so from now on any failing unit
# test anywhere blocks a production deploy, not only a missing ROUTE_HUB row.
# That is the intended trade (a red suite should not ship), and splitting the
# tests into a second job would not change it. To narrow it, run the nav tests
# alone here and move the rest to a workflow deploy does not watch.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prisma validate + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the production runtime (aaPanel runs Node 20.20.0).
          node-version: 20
          cache: npm

      # postinstall runs `prisma generate`; the schema uses a driver adapter
      # (no url in the datasource) so neither install nor validate needs a DB.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # A route segment missing from the proxy's APP_PREFIXES is served the
      # MARKETING site on the app host under the hard split, with no error
      # anywhere. That shipped /home and /my-work broken in production.
      - name: Proxy route allowlist is in step with the route folders
        run: node scripts/check-app-prefixes.mjs

      # Every column in schema.prisma is selected on every read of its model.
      # A column no migration creates throws in production on every read of
      # that model, with no error anywhere but "could not load". That shipped
      # as archivedById on 2026-09-19 and took every task down.
      - name: Every schema column has a migration that creates it
        run: node scripts/check-schema-sql.mjs

      # THE TYPE CHECK LIVES HERE, NOT IN THE PRODUCTION BUILD.
      #
      # next.config.ts sets typescript.ignoreBuildErrors, so `next build` on
      # the box skips its own TypeScript step, and this is the ONLY type check
      # between a push and production. Deploy runs only when this job
      # succeeds, so an error here still stops a release.
      #
      # Why it moved: after Phase 5 a full type check needs about 3.5 GB of
      # resident memory (measured: 3,509,469,184 bytes, 36s, no incremental
      # cache). The production box has 3921 MB with roughly 3000 MB free
      # after the OS, and next build's TypeScript step died there at its
      # 3072 MB heap cap. This runner has several times that.
      #
      # `next typegen` first: Next generates route types into .next/types,
      # and next-env.d.ts imports them, so tsc on a fresh checkout without
      # them fails on a missing module. This is the pattern Next documents.
      - name: Type check (the only one before production)
        run: npx next typegen && npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npx vitest run
