name: Deploy

# CD: on merge to main, wait for CI to pass, then SSH to the aaPanel server and
# pull → install → build (build runs migrations via scripts/deploy-migrations.mjs)
# → reload the PM2 process.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual trigger for when a CI run was lost to transient runner failures.
  # ALWAYS prefer this over ad-hoc SSH deploys: the concurrency group below
  # serializes it against auto-deploys (2026-08-07 outage: a raw SSH deploy
  # raced the pipeline deploy in the same directory and took prod down).
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to aaPanel
    runs-on: ubuntu-latest
    # Only deploy when the triggering CI run actually succeeded (manual
    # workflow_dispatch runs have no workflow_run payload and always deploy).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Pass the deploy path into the remote script.
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            # Non-interactive SSH has a minimal PATH; pin the aaPanel Node
            # install so node/npm/npx/pm2 resolve (they live here, not on the
            # default PATH).
            export PATH="/www/server/nodejs/v20.20.0/bin:$PATH"
            cd "${DEPLOY_PATH:-/www/wwwroot/workwrk.com}"

            # DIAGNOSTICS. Downloading an Actions log needs admin rights on the
            # repo, so a failing deploy shows only "exit code 1" to anyone
            # without them. GitHub DOES turn ::error:: and ::notice:: lines on
            # stdout into annotations, and annotations are readable through the
            # public API, so every failure below reports its own reason there.
            # `fail` prints the tail of the step's log as annotation lines and
            # exits, which is what makes a remote failure legible.
            fail () {
              echo "::error::DEPLOY FAILED at: $1"
              if [ -n "${2:-}" ] && [ -f "$2" ]; then
                tail -25 "$2" | while IFS= read -r l; do echo "::error::| $l"; done
              fi
              exit 1
            }

            echo "::notice::preflight disk: $(df -h / | tail -1 | tr -s ' ')"
            echo "::notice::preflight inodes: $(df -i / | tail -1 | tr -s ' ')"
            echo "::notice::preflight node $(node -v 2>&1) npm $(npm -v 2>&1)"
            echo "::notice::preflight free: $(free -m 2>/dev/null | sed -n 2p | tr -s ' ' || echo n/a)"

            echo "==> Fetching latest main"
            git fetch --prune origin main > /tmp/wd-git.log 2>&1 || fail "git fetch" /tmp/wd-git.log
            git reset --hard origin/main >> /tmp/wd-git.log 2>&1 || fail "git reset" /tmp/wd-git.log

            echo "==> Installing dependencies"
            npm ci > /tmp/wd-npmci.log 2>&1 || fail "npm ci" /tmp/wd-npmci.log

            # Build runs scripts/deploy-migrations.mjs (prisma migrate deploy
            # with advisory-lock retry) + prisma generate + next build.
            # Tee to a persistent log so a failed build is diagnosable over SSH
            # even without the Actions logs. pipefail keeps the real exit code so
            # script_stop still aborts the deploy (no pm2 reload) on failure.
            echo "==> Building (includes DB migrations)"
            npm run build > /www/wwwroot/workwrk.com/deploy-build.log 2>&1 \
              || fail "npm run build (deploy-migrations + prisma generate + next build)" /www/wwwroot/workwrk.com/deploy-build.log

            # Legacy Task -> Item data migration.
            #
            # WHY IT RUNS HERE. The release above deletes the seven /tasks/*
            # pages, which were the only interface over the legacy Task table.
            # Until this runs, those rows still exist but cannot be reached in
            # the product. Running it between a successful build and the pm2
            # reload closes that window: the build has already proved itself,
            # and nothing is serving the new code yet.
            #
            # WHY IT IS SAFE TO RUN ON EVERY DEPLOY. The script is dry-run by
            # default, so --write is deliberate. It works per organization in a
            # transaction with row-count assertions, it is idempotent (guarded
            # on LegacyRedirect plus metadata.legacyTaskId, so a second run
            # reports "already migrated, 0 to write"), and it NEVER deletes or
            # mutates a source row. Task and TaskComment stay readable.
            #
            # The dry run is printed first so the log always shows what the
            # write was about to do, next to what it did.
            #
            # A failure here does NOT abort the deploy: the product is fully
            # functional without it and only legacy rows stay unreachable,
            # which is recoverable by re-running. Losing the reload over it
            # would be the worse outcome, so it is `|| true` with a loud
            # marker to grep for.
            echo "==> Legacy task migration (dry run first)"
            npx tsx scripts/migrate-legacy-tasks.ts 2>&1 | tee /www/wwwroot/workwrk.com/legacy-tasks-dryrun.log || echo "MIGRATION-DRYRUN-FAILED"
            echo "==> Legacy task migration (write)"
            npx tsx scripts/migrate-legacy-tasks.ts --write 2>&1 | tee /www/wwwroot/workwrk.com/legacy-tasks-write.log || echo "MIGRATION-WRITE-FAILED"

            # Carry existing public SOP links over access toggle 10.
            #
            # WHY IT RUNS HERE, AND ONLY HERE. /share/sop/[token] now answers
            # only while the org's settings.access.publicLinks is "view", and
            # that toggle's default is Off. SOP.shareToken was minted before
            # the toggle existed, so without this step every public SOP link
            # in every org reads "This link is no longer available" the moment
            # the new build serves traffic. spec-process section 4 step 8 says
            # it ships with the page "never after it": between a successful
            # build and the pm2 reload is exactly that window, because the old
            # code is still the one answering.
            #
            # WHY IT IS SAFE ON EVERY DEPLOY. Dry-run by default, so --write is
            # deliberate. It works per organization in a transaction, reads the
            # value back as its own assertion, touches no key of settings other
            # than access.publicLinks, counts SOP rows without changing one,
            # and leaves an org with no public SOP on the Off default. A second
            # run reports "already migrated" and writes nothing.
            #
            # A failure does NOT abort the deploy: it is recoverable by
            # re-running, and losing the reload over it would be worse. Loud
            # marker to grep for.
            echo "==> Public SOP link carry-over (dry run first)"
            npx tsx scripts/migrate-public-sop-links.ts 2>&1 | tee /www/wwwroot/workwrk.com/public-sop-links-dryrun.log || echo "PUBLIC-SOP-DRYRUN-FAILED"
            echo "==> Public SOP link carry-over (write)"
            npx tsx scripts/migrate-public-sop-links.ts --write 2>&1 | tee /www/wwwroot/workwrk.com/public-sop-links-write.log || echo "PUBLIC-SOP-WRITE-FAILED"

            # Build ran as root; the app runs as www. Hand ownership back so
            # the runtime can read/write .next, node_modules, uploads, etc.
            echo "==> Restoring ownership to www"
            chown -R www:www "${DEPLOY_PATH:-/www/wwwroot/workwrk.com}" > /tmp/wd-chown.log 2>&1 || fail "chown" /tmp/wd-chown.log

            echo "==> Reloading PM2 process"
            pm2 reload workwrk --update-env > /tmp/wd-pm2.log 2>&1 || fail "pm2 reload" /tmp/wd-pm2.log

            # If the build was killed by the kernel rather than exiting, the
            # `fail` handler above never runs and the whole session can die
            # with it, which is what "exit code 1 and no annotations" looked
            # like. Leave a breadcrumb the next run can read either way.
            echo "::notice::post-build free: $(free -m 2>/dev/null | sed -n 2p | tr -s ' ' || echo n/a)"
            if dmesg 2>/dev/null | tail -40 | grep -qiE "out of memory|oom-killer|killed process"; then
              echo "::error::the kernel OOM killer fired during this deploy; see dmesg on the box"
              dmesg 2>/dev/null | grep -iE "out of memory|oom-killer|killed process" | tail -5 \
                | while IFS= read -r l; do echo "::error::| $l"; done
            fi

            echo "==> Deploy complete"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}