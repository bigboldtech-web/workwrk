name: Deploy

# CD: when CI passes on a push to main, deploy the newest commit on main whose
# CI passed (a manual run: the sha it names, which CI must have passed). The
# RELEASE IS BUILT HERE, on GitHub's runner, and shipped to the aaPanel server
# with its checksum; the server fetches the commit, installs (only when the
# lockfile changed), applies the database migrations, unpacks the build beside
# the live release, swaps it in, reloads PM2, checks the new release answers,
# and puts back whatever it changed if anything fails.
#
# WHY THE BUILD LEFT THE BOX (2026-10-21). The box has 3921 MB, and a
# production build needs between 2560 and 3072 MB of heap on top of the live
# app (next.config.ts measured it in September). The deploy of 0b229c9b was
# killed by the kernel's out-of-memory killer mid-build; production stayed on
# the release it served, and only a retry got it out. The runner has 16 GB.
# The build runs at the box's own path with the box's own settings files
# (without the database addresses: the build needs no database, the gate
# builds with no settings at all), so it is the same build the box made.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual trigger for when a CI run was lost to transient runner failures, or
  # to go back to an earlier commit. It deploys only a commit CI passed (the
  # first step checks). ALWAYS prefer this over ad-hoc SSH deploys: the
  # concurrency group below serializes it against auto-deploys (2026-08-07
  # outage: a raw SSH deploy raced the pipeline deploy in the same directory
  # and took prod down).
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to deploy (empty: the newest commit on main whose CI passed). CI must have passed for it."
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy to aaPanel
    runs-on: ubuntu-latest
    # On the JOB, not the workflow: a run whose job the condition below skips
    # (a fork's pull request named main, a failed CI) never enters the group,
    # so it can never replace a waiting deploy. Runs that do enter it are
    # serialised, and the box itself also takes a lock (the script below).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # A CI run that passed on a PUSH to this repository's main, on its FIRST
    # attempt. The branches filter above matches the head branch NAME of the
    # run that triggered it, and for a pull request from a fork that is the
    # fork's own branch: a fork whose branch is called main could otherwise
    # rebuild production on every push to its pull request. A re-run of a CI
    # run never deploys: it would deploy the newest green commit again, even
    # one a manual run had just gone back from; a commit whose CI had to be
    # re-run is deployed by the next push or a manual run.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.run_attempt == 1 &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    permissions:
      actions: read
      contents: read
    env:
      # A manual run's sha. Empty for an automatic run, which deploys the
      # newest commit on main whose CI passed (the first step picks it).
      REQUESTED_SHA: ${{ inputs.sha }}
    steps:
      - name: Pick the commit, and check CI passed for it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The CI run that started an automatic run; empty for a manual one.
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NUM: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          runs="repos/$REPO/actions/workflows/ci.yml/runs"
          # WHICH RUNS COUNT IS DECIDED HERE, from each run's own fields, and
          # GitHub is asked with one filter only. Its list answers some filter
          # combinations from an index it does not keep current: asked for
          # branch=main, event=push and status=success together on 2026-10-05,
          # it named a run from 2026-09-07 as the newest, so the first deploy
          # of Batch 12 picked a month-old commit (the box refused it as older
          # than the live one, so production did not change).
          green='.conclusion == "success" and .event == "push" and .head_branch == "main" and .head_repository.full_name == $repo'
          if [ -n "${REQUESTED_SHA:-}" ]; then
            sha="$REQUESTED_SHA"
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::'$sha' is not a full commit sha; give the 40-character sha."
              exit 1
            fi
            # A run of a PUSH to main only: a pull request's run tested a
            # merge ref (that head merged into main at the time, or a fork's
            # own ci.yml), never the commit itself.
            n=$(gh api "$runs?head_sha=$sha&per_page=50" \
              | jq -r --arg repo "$REPO" --arg sha "$sha" "[.workflow_runs[] | select(.head_sha == \$sha and $green)] | length")
            if [ "${n:-0}" -lt 1 ]; then
              echo "::error::CI has not passed on a push to main for $sha, so it is not deployed."
              exit 1
            fi
          else
            # The newest commit on main whose push CI passed, never "whatever
            # main is now". GitHub keeps only one waiting run per concurrency
            # group, so when CI runs finish out of order the run that survives
            # can be an older commit's: picking the newest green commit here
            # means it deploys the newest one. A commit CI has not passed yet
            # is never picked.
            newest=$(gh api "$runs?branch=main&per_page=100" \
              | jq -r --arg repo "$REPO" "[.workflow_runs[] | select($green)] | first // empty | \"\\(.run_number) \\(.head_sha)\"")
            num="${newest%% *}"
            sha="${newest#* }"
            # Never older than the CI run that started this one: if the list
            # has not caught up with that run yet, its commit is the newest
            # green one.
            if [ -n "${TRIGGER_SHA:-}" ] && { [ -z "$newest" ] || [ "${TRIGGER_NUM:-0}" -gt "$num" ]; }; then
              sha="$TRIGGER_SHA"
            fi
            if [ -z "$sha" ]; then
              echo "::error::no CI run on main has passed, so nothing is deployed."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::deploying $sha (CI passed)"

      - name: Check out the commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          path: checkout

      - name: Node, the version the box runs
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: checkout/package-lock.json

      - name: Build the release, and ship it to the box
        id: build
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          APP="${DEPLOY_PATH:-/www/wwwroot/workwrk.com}"
          # Annotations, since only admins can download an Actions log: the
          # tail of a failed step's log is printed as ::error:: lines. Nothing
          # here has touched the box yet, so production did not change.
          fail () {
            echo "::error::DEPLOY FAILED at: $1 (production stays on the release it is serving)"
            if [ -n "${2:-}" ] && [ -f "$2" ]; then
              tail -40 "$2" | while IFS= read -r l; do echo "::error::| $l"; done
            fi
            exit 1
          }
          # The key the deploy step below already uses: this step reads the
          # box's settings files and uploads the build with it, and holds no
          # more than that step does (root over SSH).
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key "$APP/.env" "$APP/.env.production"' EXIT
          PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20)
          # THE BOX'S OWN PATH, so nothing the build writes names another
          # folder than the one the release will be served from.
          sudo mkdir -p "$APP"
          sudo chown "$(id -u):$(id -g)" "$APP"
          cp -a checkout/. "$APP/"
          cd "$APP"
          npm ci > /tmp/ci-npmci.log 2>&1 || fail "npm ci on the runner" /tmp/ci-npmci.log
          # THE BOX'S OWN SETTINGS, as its build read them (.env, then
          # .env.production over it), without DATABASE_URL and DIRECT_URL.
          # Never printed; removed when this step ends.
          for f in .env .env.production; do
            ssh "${SSH_OPTS[@]}" -p "$PORT" "$SSH_USER@$SSH_HOST" "cat '$APP/$f' 2>/dev/null || true" > "/tmp/box$f" \
              || fail "reading the box's $f"
            grep -Ev '^(DATABASE_URL|DIRECT_URL)=' "/tmp/box$f" > "$APP/$f" || true
            rm -f "/tmp/box$f"
          done
          echo "::notice::building $DEPLOY_SHA on the runner: $(nproc) cpus, memory $(free -m | sed -n 2p | tr -s ' ')"
          NEXT_DIST_DIR=.next-staging NODE_OPTIONS=--max-old-space-size=6144 npx next build > /tmp/ci-build.log 2>&1 \
            || fail "next build on the runner" /tmp/ci-build.log
          [ -s .next-staging/BUILD_ID ] || fail "the build finished without a BUILD_ID" /tmp/ci-build.log
          rm -f .env .env.production
          # The build cache stays here: the box never builds.
          rm -rf .next-staging/cache
          tar -czf /tmp/release.tgz .next-staging
          SUM=$(sha256sum /tmp/release.tgz | cut -d' ' -f1)
          echo "::notice::build $(cat .next-staging/BUILD_ID), $(du -sh /tmp/release.tgz | cut -f1) packed"
          # Uploaded beside nothing the live release reads, under a name of its
          # own commit, then moved into place whole, readable by root only.
          REMOTE="/var/tmp/workwrk-release-$DEPLOY_SHA.tgz"
          scp "${SSH_OPTS[@]}" -P "$PORT" /tmp/release.tgz "$SSH_USER@$SSH_HOST:$REMOTE.part" > /tmp/ci-scp.log 2>&1 \
            || fail "uploading the build to the box" /tmp/ci-scp.log
          ssh "${SSH_OPTS[@]}" -p "$PORT" "$SSH_USER@$SSH_HOST" "chmod 600 '$REMOTE.part' && mv -f '$REMOTE.part' '$REMOTE'" \
            || fail "placing the build on the box"
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Pass the deploy path, the commit and what started the run into
          # the remote script. NO script_stop: it makes the action add an
          # "exit if the last command failed" check after every line, which
          # fires on the first line of an else branch and of every function
          # body (the failed test's status), so the deploy died at its first
          # else with no reason printed. The script stops on its own errors
          # (set -euo pipefail) and puts back what it changed (on_exit).
          envs: DEPLOY_PATH,DEPLOY_SHA,DEPLOY_EVENT,RELEASE_SHA256
          # The box no longer builds; an npm ci (when the lockfile changed)
          # and the migrations are the long parts now.
          command_timeout: 40m
          script: |
            set -euo pipefail
            # Non-interactive SSH has a minimal PATH; pin the aaPanel Node
            # install so node/npm/npx/pm2 resolve (they live here, not on the
            # default PATH).
            export PATH="/www/server/nodejs/v20.20.0/bin:$PATH"
            APP="${DEPLOY_PATH:-/www/wwwroot/workwrk.com}"
            cd "$APP"

            # DIAGNOSTICS. Downloading an Actions log needs admin rights on the
            # repo, so a failing deploy shows only "exit code 1" to anyone
            # without them. GitHub DOES turn ::error:: and ::notice:: lines on
            # stdout into annotations, and annotations are readable through the
            # public API, so every failure below reports its own reason there.
            # `fail` prints the tail of the step's log as annotation lines and
            # exits, which is what makes a remote failure legible.
            fail () {
              echo "::error::DEPLOY FAILED at: $1"
              if [ -n "${2:-}" ] && [ -f "$2" ]; then
                tail -25 "$2" | while IFS= read -r l; do echo "::error::| $l"; done
              fi
              exit 1
            }

            # ONE DEPLOY ON THE BOX AT A TIME. A job GitHub has ended
            # (cancelled, timed out, connection lost) can leave its script
            # running here, because the script ignores the hang-up so that it
            # always puts back what it changed. The next deploy waits for it,
            # then starts from what it left. PM2 is always called with this
            # descriptor closed (9>&-), so a PM2 daemon started by a deploy
            # can never hold the lock for good.
            # In a directory only root can enter: a lock file other accounts
            # could open would let any of them hold it and stop every deploy.
            LOCK_DIR="${DEPLOY_LOCK_DIR:-/run/workwrk-deploy}"
            install -d -m 700 "$LOCK_DIR" || fail "could not make the deploy lock directory $LOCK_DIR"
            exec 9>"$LOCK_DIR/lock" || fail "could not open the deploy lock in $LOCK_DIR"
            if ! flock -w 1800 9; then fail "another deploy was still running on the box after 30 minutes"; fi

            echo "::notice::preflight disk: $(df -h / | tail -1 | tr -s ' ')"
            echo "::notice::preflight inodes: $(df -i / | tail -1 | tr -s ' ')"
            echo "::notice::preflight node $(node -v 2>&1) npm $(npm -v 2>&1)"
            echo "::notice::preflight free: $(free -m 2>/dev/null | sed -n 2p | tr -s ' ' || echo n/a)"

            # THE LIVE RELEASE STAYS WHOLE, WHATEVER STOPS THE DEPLOY. The
            # server serves .next. Every step up to the swap writes somewhere
            # else (the source tree, the packages only when the lockfile
            # changed, the database with additive SQL the live release does
            # not read, .next-staging), and on_exit puts back what the stage
            # reached had changed:
            #   source   the source tree back at the live commit, and the
            #            live release's packages back if they were replaced;
            #   swapped  the new build out (.next-failed), the previous one
            #            back in, its packages and commit back, PM2 reloaded.
            # It runs on every exit: a failed step, a failed check, and a
            # session that ended mid-deploy (a cancelled job, the command
            # timeout, a dropped connection), because SIGPIPE and SIGHUP are
            # ignored and the next write to the gone session fails instead.
            STAGE=start
            PREV_SHA=""
            OLD_BUILD=none
            put_back_packages () {
              if [ -d node_modules-prev ]; then
                rm -rf node_modules-failed
                if [ -d node_modules ]; then mv node_modules node_modules-failed; fi
                mv node_modules-prev node_modules
              fi
            }
            on_exit () {
              rc=$?
              trap - EXIT
              set +e
              case "$STAGE" in
                source)
                  put_back_packages
                  git reset --hard "$PREV_SHA" > /dev/null 2>&1
                  echo "::error::the source tree is back at $PREV_SHA, the commit the live build was made from; production did not change"
                  ;;
                swapped)
                  if [ -d .next-prev ]; then
                    rm -rf .next-failed
                    if [ -d .next ]; then mv .next .next-failed; fi
                    mv .next-prev .next
                    put_back_packages
                    git reset --hard "$PREV_SHA" > /dev/null 2>&1
                    pm2 reload workwrk --update-env 9>&- > /tmp/wd-pm2-back.log 2>&1
                    if back=$(check_release "$OLD_BUILD" previous); then
                      echo "::error::the previous build ($OLD_BUILD, $PREV_SHA) is serving again. The failed one is in .next-failed"
                    else
                      echo "::error::the previous build was put back but does not pass its check either ($back): look at the box now"
                    fi
                  else
                    echo "::error::there is no previous build to go back to: look at the box now"
                  fi
                  ;;
              esac
              exit "$rc"
            }
            trap on_exit EXIT
            trap '' PIPE HUP

            # The new release must answer. pm2 reload returns once the process
            # is launched, so a release that crashed on boot or answered 500
            # everywhere used to be reported "Deploy complete". Through the
            # app's public address (BASE, below): /api/health must report the
            # build, then /login and one of its scripts must load.
            # The APP host: NEXT_PUBLIC_APP_URL, else NEXTAUTH_URL. On this
            # box NEXTAUTH_URL is the marketing host, where the host split
            # sends /login on to the app host (308), so the first check that
            # read it there failed a good release and the release before it.
            envval () { grep -E "^$1=" .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d "\"'" | sed 's#/*$##' || true; }
            BASE=$(envval NEXT_PUBLIC_APP_URL)
            BASE="${BASE:-$(envval NEXTAUTH_URL)}"
            BASE="${BASE:-https://app.workwrk.com}"
            check_release () {
              # $1: the BUILD_ID that must be serving. $2 "previous": a build
              # from before Batch 12, whose /api/health names no build, also
              # passes on "status":"ok".
              local want="$1" kind="${2:-}" body="" i
              for i in $(seq 1 40); do
                sleep 3
                body=$(curl -fsS --max-time 5 "$BASE/api/health" 2>/dev/null || true)
                case "$body" in
                  *"\"build\":\"$want\""*) break ;;
                  *"\"build\":"*) ;;
                  *"\"status\":\"ok\""*) [ "$kind" = previous ] && break ;;
                esac
                body=""
              done
              [ -n "$body" ] || { echo "health never reported build $want"; return 1; }
              local login chunk asset
              # A redirect to the page's own host is followed: the answer that
              # counts is the page's.
              login=$(curl -sL --max-redirs 3 -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/login" || echo 000)
              [ "$login" = "200" ] || { echo "/login answered $login"; return 1; }
              chunk=$(cd .next/static/chunks 2>/dev/null && ls -1 -- *.js 2>/dev/null | head -1 || true)
              if [ -n "$chunk" ]; then
                asset=$(curl -sL --max-redirs 3 -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/_next/static/chunks/$chunk" || echo 000)
                [ "$asset" = "200" ] || { echo "a script of the build answered $asset"; return 1; }
              fi
              return 0
            }

            echo "==> Fetching $DEPLOY_SHA"
            # The commit the LIVE build was made from: written beside each
            # build since Batch 12 (a failed deploy leaves HEAD at its own
            # commit, so HEAD alone can name a commit that never served).
            PREV_SHA=$(cat .next/DEPLOY_SHA 2>/dev/null || git rev-parse HEAD)
            OLD_BUILD=$(cat .next/BUILD_ID 2>/dev/null || echo none)
            git fetch --prune origin main > /tmp/wd-git.log 2>&1 || fail "git fetch" /tmp/wd-git.log
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main 2>>/tmp/wd-git.log \
              || fail "$DEPLOY_SHA is not a commit on main" /tmp/wd-git.log

            # An automatic run whose commit is already live, or older: a
            # deploy job that waited in the concurrency group while a newer
            # commit went live. Automatic deploys only ever go forward; going
            # back is a manual run of this workflow with the sha.
            if [ "${DEPLOY_EVENT:-}" = "workflow_run" ] && git merge-base --is-ancestor "$DEPLOY_SHA" "$PREV_SHA" 2>/dev/null; then
              echo "::notice::$DEPLOY_SHA is already live, or older than the live commit $PREV_SHA: nothing deployed. Going back is Actions > Deploy > Run workflow with the sha."
              STAGE=done
              exit 0
            fi

            # A commit from before Batch 12 has no deploy:migrate step and
            # builds into the live .next: this workflow cannot deploy it, and
            # says so before touching anything.
            PKG=$(git show "$DEPLOY_SHA:package.json" 2>/dev/null || true)
            CFG=$(git show "$DEPLOY_SHA:next.config.ts" 2>/dev/null || true)
            case "$PKG" in *'"deploy:migrate"'*) ;; *) fail "$DEPLOY_SHA is from before Batch 12, which this workflow cannot deploy. Going back that far is done by hand on the box (scripts/DEPLOY-NOTES.md, Going back)" ;; esac
            case "$CFG" in *NEXT_DIST_DIR*) ;; *) fail "$DEPLOY_SHA is from before Batch 12, which this workflow cannot deploy. Going back that far is done by hand on the box (scripts/DEPLOY-NOTES.md, Going back)" ;; esac

            STAGE=source
            git reset --hard "$DEPLOY_SHA" >> /tmp/wd-git.log 2>&1 || fail "git reset" /tmp/wd-git.log

            # npm ci deletes node_modules before it installs, under the running
            # server, which loads some modules only on first use. So it runs
            # only when package-lock.json changed since the last install it
            # did (the hash it leaves in node_modules); otherwise the client
            # is regenerated for the new schema and the rest is kept. When it
            # runs, the live release's packages are moved aside first, not
            # deleted, so a deploy that stops puts them back (on_exit).
            echo "==> Dependencies"
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ -d node_modules ] && [ "$(cat node_modules/.deploy-lock-hash 2>/dev/null || true)" = "$LOCK_HASH" ]; then
              echo "::notice::package-lock.json unchanged; node_modules kept"
              npx prisma generate > /tmp/wd-generate.log 2>&1 || fail "prisma generate" /tmp/wd-generate.log
            else
              rm -rf node_modules-prev node_modules-failed
              if [ -d node_modules ]; then mv node_modules node_modules-prev; fi
              npm ci > /tmp/wd-npmci.log 2>&1 || fail "npm ci" /tmp/wd-npmci.log
              echo "$LOCK_HASH" > node_modules/.deploy-lock-hash
            fi

            # The additive SQL manifest, each file under a 5 second lock
            # timeout and tried up to four times, then any pending Prisma
            # migration through `prisma migrate deploy` (no lock timeout,
            # tried three times; scripts/deploy-migrations.mjs). Before the
            # build: the new release reads what they add. Schema only: no data
            # script runs in a deploy (scripts/MIGRATIONS.md, The approval
            # gate).
            echo "==> Database migrations"
            npm run deploy:migrate > "$APP/deploy-migrate.log" 2>&1 \
              || fail "database migrations (production stays on the release it is serving)" "$APP/deploy-migrate.log"

            # THE BUILD WAS MADE ON GITHUB'S RUNNER (the step before this
            # one), at this same path, and uploaded with its checksum. It is
            # unpacked beside the live build (NEXT_DIST_DIR), so the server
            # keeps serving .next throughout. The box never builds: on
            # 2026-10-21 a build here was killed out of memory.
            echo "==> Unpacking the build made on GitHub's runner"
            find /var/tmp -maxdepth 1 -name 'workwrk-release-*.tgz*' -mmin +1440 -delete 2>/dev/null || true
            REL="/var/tmp/workwrk-release-$DEPLOY_SHA.tgz"
            [ -f "$REL" ] || fail "the build made on GitHub's runner is not on the box ($REL); production stays on the release it is serving"
            echo "${RELEASE_SHA256:-none}  $REL" | sha256sum -c - > /tmp/wd-release.log 2>&1 \
              || fail "the build's checksum does not match what the runner made (production stays on the release it is serving)" /tmp/wd-release.log
            rm -rf .next-staging
            tar -xzf "$REL" -C "$APP" > /tmp/wd-untar.log 2>&1 \
              || { rm -rf .next-staging; fail "unpacking the build (production stays on the release it is serving)" /tmp/wd-untar.log; }
            rm -f "$REL"
            [ -s .next-staging/BUILD_ID ] || fail "the build arrived without a BUILD_ID (production stays on the release it is serving)"
            NEW_BUILD=$(cat .next-staging/BUILD_ID)
            echo "$DEPLOY_SHA" > .next-staging/DEPLOY_SHA

            # Build ran as root; the app runs as www. Hand ownership back BEFORE
            # the swap, so the gap between the swap and the reload is as short
            # as two renames. Local files live in storage/uploads since Batch
            # 11 (moved out of public/ at each start, one way):
            # scripts/MIGRATIONS.md, "Local uploads", says how to go back to
            # an older build.
            echo "==> Restoring ownership to www"
            chown -R www:www "$APP" > /tmp/wd-chown.log 2>&1 || fail "chown" /tmp/wd-chown.log

            echo "==> Switching to build $NEW_BUILD (was $OLD_BUILD)"
            rm -rf .next-prev .next-failed
            STAGE=swapped
            if [ -d .next ]; then mv .next .next-prev; fi
            mv .next-staging .next

            echo "==> Reloading PM2 process"
            pm2 reload workwrk --update-env 9>&- > /tmp/wd-pm2.log 2>&1 || fail "pm2 reload" /tmp/wd-pm2.log

            echo "==> Checking the new release at $BASE"
            if ! why=$(check_release "$NEW_BUILD"); then
              fail "the new release did not pass its check: $why"
            fi
            STAGE=done
            # The release is live and answering: the packages it replaced
            # are no longer needed.
            rm -rf node_modules-prev node_modules-failed

            # If the build was killed by the kernel rather than exiting, the
            # `fail` handler above never runs and the whole session can die
            # with it, which is what "exit code 1 and no annotations" looked
            # like. Leave a breadcrumb the next run can read either way.
            echo "::notice::post-build free: $(free -m 2>/dev/null | sed -n 2p | tr -s ' ' || echo n/a)"
            if dmesg 2>/dev/null | tail -40 | grep -iE "out of memory|oom-killer|killed process" > /dev/null; then
              echo "::error::the kernel OOM killer fired during this deploy; see dmesg on the box"
              dmesg 2>/dev/null | grep -iE "out of memory|oom-killer|killed process" | tail -5 \
                | while IFS= read -r l; do echo "::error::| $l"; done
            fi

            echo "::notice::live: build $NEW_BUILD, commit $DEPLOY_SHA (previous build kept in .next-prev)"
            echo "==> Deploy complete"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.pick.outputs.sha }}
          DEPLOY_EVENT: ${{ github.event_name }}
          RELEASE_SHA256: ${{ steps.build.outputs.sha256 }}
