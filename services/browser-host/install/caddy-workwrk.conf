# Caddy's drop-in on the browser server (docs/plans/browser-host.md
# Decision 18): under memory pressure the kernel kills a browser first.
# Caddy holds every live view's frames and every connection's bytes in the
# clear, so none of its memory is ever written to swap or a core dump
# (final privacy review, M3).
[Service]
OOMScoreAdjust=-900
MemorySwapMax=0
LimitCORE=0
