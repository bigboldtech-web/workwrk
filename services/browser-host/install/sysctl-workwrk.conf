# The browser server's kernel settings (docs/plans/browser-host.md 8.2;
# final privacy review, M3): a process that crashes leaves no core file. Its
# memory may hold the page a person saw or what they typed, so the kernel
# hands every core dump to /bin/false, which reads nothing and keeps nothing,
# and a setuid program never dumps. Installed as
# /etc/sysctl.d/60-workwrk-core.conf, after systemd-coredump's 50- file;
# apport, which would set its own pattern at boot, is masked.
kernel.core_pattern=|/bin/false
fs.suid_dumpable=0
