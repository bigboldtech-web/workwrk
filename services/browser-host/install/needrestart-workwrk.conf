# The browser server (docs/plans/browser-host.md 8.4): a library update
# never restarts Docker, containerd, the host, the launcher or Caddy at
# whatever hour it lands, which would end every open browser. The
# maintenance job restarts them, drained, at 04:30.
$nrconf{override_rc}->{qr(^docker)} = 0;
$nrconf{override_rc}->{qr(^containerd)} = 0;
$nrconf{override_rc}->{qr(^workwrk-browser)} = 0;
$nrconf{override_rc}->{qr(^caddy)} = 0;
