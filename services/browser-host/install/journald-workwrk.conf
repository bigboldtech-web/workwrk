# The browser server's journal (docs/plans/browser-host.md section 7): at
# most 200 MB, and nothing kept past 15 days (final privacy review, M2).
# MaxRetentionSec removes a journal file once its newest entry is 14 days
# old, and MaxFileSec starts a new file every day, so no file spans more
# than a day and no entry outlives 15. The journal is the server's only
# log: rsyslog is masked (install.sh step_os), so nothing is copied to the
# syslog socket either.
[Journal]
SystemMaxUse=200M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
